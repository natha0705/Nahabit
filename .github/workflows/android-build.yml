name: Compilar Nahabit APK y AAB

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK 100% Local
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Gradle 8.9 en la nube
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: 4. Compilar APK Debug
        run: gradle assembleDebug --stacktrace

      - name: 5. Subir APK Debug para descarga directa
        uses: actions/upload-artifact@v4
        with:
          name: Nahabit-Instalable-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
