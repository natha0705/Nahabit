name: CI/CD Nahabit APK, Tests y Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & Build Nahabit (100% Local)
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: 1. Checkout código
        uses: actions/checkout@v4

      - name: 2. Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Gradle 8.9 en la nube
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: 4. Ejecutar Suite de Pruebas Unitarias
        run: gradle testDebugUnitTest --stacktrace

      - name: 5. Compilar APK Debug Instalable
        run: gradle assembleDebug --stacktrace

      - name: 6. Subir Artefacto APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: Nahabit-Instalable-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 7. Compilar Release Firmado (APK + AAB Google Play)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/app/release-keystore.jks
          gradle assembleRelease bundleRelease --stacktrace
          rm -f ${{ github.workspace }}/app/release-keystore.jks

      - name: 8. Publicar automáticamente en GitHub Releases al crear un tag (v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
